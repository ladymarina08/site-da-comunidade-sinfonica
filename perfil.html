<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil — Comunidade Sinfônica</title>
  <meta name="description" content="Gerencie seus dados e sua senha na Comunidade Sinfônica." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0505' stroke='%23d4af37' stroke-width='3'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23d4af37'%3E%E2%99%AA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="inicio.html" class="logo">Comunidade <span>Sinfônica</span></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <span class="nav-greeting" id="userGreeting"></span>
        <a href="inicio.html">Início</a>
        <a href="agenda.html">Agenda</a>
        <a href="bandas.html">Bandas</a>
        <a href="playlists.html">Playlists</a>
        <a href="sobre.html">Sobre</a>
        <a href="perfil.html" aria-current="page">Meu Perfil</a>
        <a href="admin.html" class="nav-admin" id="adminLink">Admin</a>
        <a href="index.html" class="nav-logout" id="logoutLink">Sair</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero container">
      <h1>Meu Perfil</h1>
      <p>Gerencie seus dados e sua senha.</p>
    </section>

    <section class="admin-section">
      <h2>Meus dados</h2>
      <form class="form-card" id="perfilForm">
        <div class="form-grid">
          <div>
            <label for="perfilNome">Nome</label>
            <input type="text" id="perfilNome" required />
          </div>
          <div>
            <label for="perfilEmail">E-mail</label>
            <input type="email" id="perfilEmail" required />
          </div>
        </div>
        <p class="perfil-info-extra">
          Membro desde <strong id="perfilMembroDesde">—</strong>
          <span id="perfilBadgeAdmin" class="perfil-badge-admin" hidden>· Administrador(a)</span>
        </p>
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
        <p class="form-message" id="perfilMsg" role="status"></p>
      </form>
    </section>

    <section class="admin-section">
      <h2>Alterar senha</h2>
      <form class="form-card" id="senhaForm">
        <label for="senhaAtual">Senha atual</label>
        <div class="password-field">
          <input type="password" id="senhaAtual" required />
          <button type="button" class="toggle-senha" data-target="senhaAtual" aria-label="Mostrar senha">
            <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
            <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.87 20.87 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.87 20.87 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" /></svg>
          </button>
        </div>

        <label for="senhaNova">Nova senha</label>
        <div class="password-field">
          <input type="password" id="senhaNova" minlength="6" required />
          <button type="button" class="toggle-senha" data-target="senhaNova" aria-label="Mostrar senha">
            <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
            <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.87 20.87 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.87 20.87 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" /></svg>
          </button>
        </div>

        <label for="senhaNovaConfirmar">Confirmar nova senha</label>
        <div class="password-field">
          <input type="password" id="senhaNovaConfirmar" minlength="6" required />
          <button type="button" class="toggle-senha" data-target="senhaNovaConfirmar" aria-label="Mostrar senha">
            <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
            <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.87 20.87 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.87 20.87 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" /></svg>
          </button>
        </div>

        <button type="submit" class="btn btn-primary">Alterar senha</button>
        <p class="form-message" id="senhaMsg" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Comunidade Sinfônica — <a href="sobre.html">sobre a comunidade</a></p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
